version: "3.9"
services:
  topolsea:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "6333:6333"
    environment:
      TOPOLSEA_API_KEY: ${TOPOLSEA_API_KEY:-}
      RUST_LOG: info
    volumes:
      - topolsea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:6333/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  topolsea-data:
