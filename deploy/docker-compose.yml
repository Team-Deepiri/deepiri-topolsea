version: "3.9"
services:
  topolsea:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "6333:6333"
    environment:
      TOPOLSEA_API_KEY: ${TOPOLSEA_API_KEY:-}
      RUST_LOG: info
    volumes:
      - topolsea-data:/data
    healthcheck:
      # Avoid curl on slim images — use bash /dev/tcp.
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  topolsea-data:
